<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Private service directory for the DGX Spark.">
    <title>Spark Hub</title>
    <style>
      :root {
        --bg:#090b0a; --surface:#111412; --line:#292e2a; --text:#edf1ed;
        --muted:#8a918c; --accent:#c7ff43; --red:#ff6b61;
        font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        color:var(--text); background:var(--bg); font-synthesis:none;
      }
      *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% -20%,rgba(199,255,67,.09),transparent 34rem),var(--bg)}
      .shell{width:min(1240px,calc(100% - 40px));margin:auto;padding:30px 0 24px}
      header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}
      .eyebrow{margin:0 0 7px;color:var(--accent);font:650 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.17em}
      h1{margin:0;font-size:clamp(34px,5vw,64px);line-height:.95;letter-spacing:-.065em}
      .intro{max-width:470px;margin:0;color:var(--muted);font-size:13px;line-height:1.6;text-align:right}
      .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
      .service-card{grid-column:span 2;display:flex;flex-direction:column;min-height:290px;padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(150deg,rgba(255,255,255,.025),transparent 40%),var(--surface)}
      .service-card:first-child{grid-column:span 3}.service-card:nth-child(2){grid-column:span 3}
      .service-top,.status-row,.service-links{display:flex;align-items:center}.service-top{justify-content:space-between}
      .service-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:#11170a;background:var(--accent);font:800 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
      .access-badge{padding:6px 8px;border:1px solid var(--line);border-radius:7px;color:var(--muted);font:650 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em}
      h2{margin:26px 0 7px;font-size:21px;letter-spacing:-.035em}.service-card p{min-height:42px;margin:0;color:var(--muted);font-size:11.5px;line-height:1.55}
      .status-row{flex-wrap:wrap;gap:8px;margin-top:18px}.status{display:flex;align-items:center;gap:6px;color:var(--muted);font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace}.status i{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px rgba(255,107,97,.5)}.status.online i{background:var(--accent);box-shadow:0 0 8px rgba(199,255,67,.45)}
      code{display:block;overflow:hidden;margin-top:15px;padding:8px 10px;border-radius:7px;color:#aeb6b0;background:#090b0a;font:10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;text-overflow:ellipsis;white-space:nowrap}
      .service-links{gap:8px;margin-top:auto;padding-top:20px}.service-links a{padding:9px 11px;border:1px solid #343a35;border-radius:8px;color:var(--text);text-decoration:none;font-size:11px;transition:background 140ms,border-color 140ms}.service-links a:hover{border-color:#5b655d;background:rgba(255,255,255,.035)}.service-links span{color:var(--accent)}
      footer{display:flex;justify-content:space-between;gap:20px;margin-top:18px;color:#626963;font:10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}footer a{color:#aab2ac;text-decoration:none}
      @media(max-width:850px){header{align-items:flex-start;flex-direction:column}.intro{text-align:left}.service-card,.service-card:first-child,.service-card:nth-child(2){grid-column:span 3}}
      @media(max-width:580px){.shell{width:calc(100% - 24px);padding-top:20px}.service-card,.service-card:first-child,.service-card:nth-child(2){grid-column:1/-1;min-height:250px}footer{flex-direction:column}}
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div><p class="eyebrow">PRIVATE SERVICE DIRECTORY</p><h1>Spark Hub</h1></div>
        <p class="intro">One private starting point for the DGX Spark. Public and Tailnet-only boundaries are shown explicitly; status is checked when this page loads.</p>
      </header>
      <section class="grid" aria-label="Spark services">{{SERVICE_CARDS}}</section>
      <footer><span>Tailnet-only directory · no credentials · no control actions</span><a href="/apps">Refresh status ↻</a></footer>
    </main>
  </body>
</html>
